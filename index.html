<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're not connected</title>
<style>
:root{--ink:#172033;--muted:#778398;--blue:#6675e8;--blue-hover:#5362d3}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px 20px;background:#fff;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.page{width:min(100%,680px);text-align:center;animation:fade .5s ease both}
.illustration{display:block;width:min(100%,440px);height:auto;margin:0 auto 24px}
h1{font-size:clamp(2rem,5vw,3rem);line-height:1.15;letter-spacing:-.045em;margin:0 0 18px;font-weight:750}
.description{font-size:clamp(1rem,2.6vw,1.25rem);line-height:1.65;color:var(--muted);margin:0}
.actions{display:flex;flex-direction:column;align-items:center;gap:20px;margin-top:34px}
.retry{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-width:240px;min-height:58px;padding:15px 28px;border:0;border-radius:15px;background:var(--blue);color:#fff;font:inherit;font-size:1.1rem;font-weight:600;cursor:pointer;box-shadow:0 7px 18px #6675e82b;transition:background .2s,transform .2s}
.retry:hover{background:var(--blue-hover);transform:translateY(-1px)}
.retry:focus-visible,.back:focus-visible{outline:3px solid #c4cbff;outline-offset:4px}
.retry:disabled{opacity:.75;cursor:wait}
.retry svg{width:22px;height:22px}
.back{display:inline-flex;align-items:center;gap:10px;padding:4px 8px;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;cursor:pointer}
.back:hover{color:var(--ink)}
.status{min-height:24px;margin-top:16px;color:var(--muted);font-size:.9rem}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:480px){body{padding:22px 18px}.illustration{margin-bottom:20px}.actions{margin-top:28px}.retry{width:100%;max-width:300px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#musicButton {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 9999;
  padding: 12px 18px;
  border: 1px solid rgba(255, 190, 220, 0.3);
  border-radius: 30px;
  background: rgba(35, 20, 35, 0.85);
  color: #ffc4dc;
  font-size: 14px;
  cursor: pointer;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: all 0.3s ease;
}

#musicButton:hover {
  background: rgba(100, 40, 75, 0.95);
  transform: translateY(-2px);
}

#musicButton.playing {
  border-color: rgba(255, 190, 220, 0.65);
  box-shadow: 0 0 15px rgba(255, 100, 170, 0.15);
}

</style>
</head>
<body>
<main class="page">
  <svg class="illustration" viewBox="0 0 500 330" role="img" aria-label="Một trái tim màu hồng bị vỡ, các mảnh vỡ rơi xuống cạnh biểu tượng Wi-Fi mất kết nối">
    <defs>
      <linearGradient id="heartLeft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5a1b4"/><stop offset="1" stop-color="#df5e7b"/></linearGradient>
      <linearGradient id="heartRight" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8b0bf"/><stop offset="1" stop-color="#cf4d70"/></linearGradient>
      <linearGradient id="robot" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#dbe3ec"/></linearGradient>
    </defs>
    <!-- Soft clouds -->
    <path d="M42 68c-17 0-24-20-8-29 4-22 36-27 46-7 16-7 31 5 29 19-2 10-10 17-22 17Z" fill="#edf1f6"/>
    <path d="M405 178c-12 0-17-15-5-20 3-16 25-19 32-5 11-5 22 4 20 14-1 7-8 11-16 11Z" fill="#edf1f6"/>
    <!-- Ground -->
    <ellipse cx="251" cy="278" rx="180" ry="14" fill="#e3e8ef"/>
    <g stroke="#a4b0c1" stroke-width="7" stroke-linecap="round" fill="none"><path d="M90 275l-14-32M99 276l4-44M108 276l19-32M393 276l-3-31M403 276l17-28"/></g>
    <!-- Disconnected Wi-Fi -->
    <!-- <g fill="none" stroke="#8998ad" stroke-width="12" stroke-linecap="round"><path d="M302 92c33-32 82-32 115 0"/><path d="M317 114c24-23 61-23 85 0"/><path d="M333 136c15-14 38-14 53 0"/></g> -->
    <circle cx="360" cy="153" r="6.5" fill="#8998ad"/>
    <!-- <circle cx="416" cy="139" r="21" fill="#718198"/><path d="M409 132l14 14m0-14-14 14" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/> -->
    <!-- Broken heart shadow -->
    <path d="M244 129c-21-31-68-18-68 18 0 31 35 56 68 81 33-25 68-50 68-81 0-36-47-49-68-18Z" fill="#f4b5c2" opacity=".35" transform="translate(5 7)"/>
    <!-- Heart halves separated by jagged crack -->
    <path d="M239 130c-18-27-59-18-62 14-3 27 24 48 57 74l8-31-12-13 14-14-10-13 12-17Z" fill="url(#heartLeft)" stroke="#d45b78" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M251 130c18-27 59-18 62 14 3 27-24 48-57 74l-7-31 13-13-12-14 10-13-12-17Z" fill="url(#heartRight)" stroke="#d45b78" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Floating fragments -->
    <path d="M185 221l12-5 8 11-14 7Z" fill="#e77a94"/><path d="M293 230l10-7 9 10-13 6Z" fill="#e77a94"/>
    <path d="M227 248l13-5 9 10-16 5Z" fill="#d95c7b"/><path d="M272 252l9-5 8 8-12 5Z" fill="#e77a94"/>
    <path d="M205 99l8-10 9 8-8 9Z" fill="#f0a0b2"/><path d="M300 104l7-7 8 7-8 8Z" fill="#f0a0b2"/>
    <!-- Sad little robot -->
    <g transform="rotate(-7 148 183)">
      <circle cx="151" cy="143" r="48" fill="url(#robot)" stroke="#c8d2df" stroke-width="4"/>
      <ellipse cx="159" cy="151" rx="35" ry="28" fill="#263246"/>
      <path d="M147 148l-2 7m27-8-2 7" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      <circle cx="103" cy="151" r="9" fill="#8999ac"/>
    </g>
    <path d="M119 190c-19 8-28 29-25 49 3 18 18 27 36 21l27-12-2-47Z" fill="url(#robot)" stroke="#526176" stroke-width="3.5"/>
    <path d="M155 193c15-10 28-4 34 13l11 30c4 10-4 18-15 18h-15l-15-33Z" fill="url(#robot)" stroke="#526176" stroke-width="3.5"/>
    <path d="M131 239c11-7 21-4 28 4 6 7 3 14-7 16l-22 1c-10-1-12-12 1-21Z" fill="#dbe3ec" stroke="#526176" stroke-width="3.5"/>
    <!-- Tiny floating dots -->
    <circle cx="335" cy="203" r="3" fill="#e9a0b2"/><circle cx="185" cy="177" r="3" fill="#e9a0b2"/><circle cx="322" cy="246" r="4" fill="#f0bdc8"/>
  </svg>

  <h1>You're not connected</h1>
  <p class="description">Looks like the connection between us got lost.<br>The internet is not issue</p>
  <div class="actions">
    <button class="retry" id="retryButton" type="button">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 9A7 7 0 0 1 18 6l2 6M4 12l2 6a7 7 0 0 0 12.5-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="retryLabel">Try again</span>
    </button>
    <button class="back" id="backButton" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5m0 0 7-7m-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Go back</button>
  </div>
  <p class="status" id="statusMessage" aria-live="polite"></p>
</main>

<script>
const retryButton = document.getElementById("retryButton");
const retryLabel = document.getElementById("retryLabel");
const statusMessage = document.getElementById("statusMessage");
const backButton = document.getElementById("backButton");

const facebookURL = "https://www.facebook.com/XunaDugno";
const storageKey = "retryClickCount";

let clickCount = Number(sessionStorage.getItem(storageKey)) || 0;

retryButton.addEventListener("click", async () => {
  clickCount++;
  sessionStorage.setItem(storageKey, clickCount);

  if (clickCount >= 3) {
    sessionStorage.removeItem(storageKey);
    window.location.href = facebookURL;
    return;
  }

  retryButton.disabled = true;
  retryLabel.textContent = "Checking...";
  statusMessage.textContent = "";

  try {
    await fetch(
      "https://www.google.com/favicon.ico?_=" + Date.now(),
      {
        mode: "no-cors",
        cache: "no-store"
      }
    );

    statusMessage.textContent = "Bbi, u make me upset";
  } catch {
    statusMessage.textContent = "Bbi, u make me upset";
  }

  retryButton.disabled = false;
  retryLabel.textContent = "Try again";
});


backButton.addEventListener("click", () => {
  statusMessage.textContent =
    "You wanna go back? How? No future for us. My girl has someone else =))) After all, I just wanna kill her.";
});

</script>

<!-- Background music -->
<audio id="bgMusic" autoplay loop preload="auto">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<button id="musicButton" type="button" aria-label="Play or pause music">
  ♫ Turn on the music
</button>

<script>
const bgMusic = document.getElementById("bgMusic");
const musicButton = document.getElementById("musicButton");

// Âm lượng 25%
bgMusic.volume = 1;

async function startMusic() {
  try {
    await bgMusic.play();
    musicButton.textContent = "♫ Pause music";
    musicButton.classList.add("playing");
  } catch (error) {
    // Trình duyệt chặn autoplay: chờ người dùng bấm nút
    musicButton.textContent = "♫ Turn on the music";
  }
}

musicButton.addEventListener("click", async () => {
  if (bgMusic.paused) {
    try {
      await bgMusic.play();
      musicButton.textContent = "♫ Pause music";
      musicButton.classList.add("playing");
    } catch (error) {
      musicButton.textContent = "♫ Music unavailable";
    }
  } else {
    bgMusic.pause();
    musicButton.textContent = "♫ Turn on the music";
    musicButton.classList.remove("playing");
  }
});

// Thử phát ngay khi trang tải
startMusic();
</script>

</body>
</html>
